const qa = [

  q:"什麼叫「照顧爭議」？",

  laws:[{no:"第3條第20款",text:"照顧爭議：指兒童之法定代理人或實際照顧兒童之人認為托育品質不符期待，應由托育相關人員負責所生之爭議。"}],
  note:"此定義劃出調處機制（第67條）的適用範圍：僅限於「托育品質不符期待」所生之爭議，若涉及違法對待兒童等情事，則應轉為第57條以下的違法事件調查、通報程序，而非單純調處。"
},
{

  laws:[{no:"第94條",text:"本法施行日期，由行政院定之。"}],
  note:"鑑於本法授權訂定之法規命令甚多，且相關資訊系統、人員訓練或制度宣導（如托育機構監視攝錄影音資料雲端儲存系統、違法事件調查人員培訓等）尚需時間建置或辦理，為利本法施行周妥並緩衝對業者及從業人員之影響，爰不逕行訂定施行日期，改由行政院視籌備進度另定。"
},
{
  cat:"general", pages:["general"],
  q:"本法還有哪些重要的子法、施行細則尚未訂定？看條文時要特別留意什麼？",
  a:"本法有非常多條文採「原則性規定＋授權中央主管機關另訂辦法或公告」的立法方式，這些辦法／公告目前多數尚未發布。本頁面凡看到紅字「尚待訂定子法」的地方，代表該項規定的具體執行細節（例如收托人數上限、評鑑指標、契約範本、保險辦理方式等）目前還在研擬中，實務上仍應以現行法規（如居家式托育服務提供者登記及管理辦法、幼照法相關子法）及主管機關最新公告為準。值得注意的是，其中「托育機構定型化契約」並非完全從零開始：衛生福利部已於114年4月1日公告「托嬰中心定型化契約應記載及不得記載事項」（依消費者保護法第17條訂定），目前正預告部分規定修正草案，這份既有規範可望作為本法第36條第2項所定契約範本的重要基礎；但「居家托育」的定型化契約則屬全新規定，過去並無官方範本，兒童福利聯盟等團體長年呼籲補上此一缺口，本法第17條第2項首次明文要求中央主管機關訂定，是重要的立法進展。",
  laws:[{no:"第93條",text:"本法施行細則，由中央主管機關定之。"}],
  note:"這種「本法定原則、授權主管機關訂辦法」的立法體例，在本法中大量出現，是為了讓具高度變動性或技術性的細節，能以較有彈性的行政規則因應實務調整，而不必每次修正都經過立法程序。以下為本法全案授權子法、辦法、準則與公告的完整清單，供快速對照：\n① 第7條第1項第9款（地方）：違反本法應處罰鍰程度裁量基準。\n② 第9條第2項（中央）：托育服務內容之實施準則。\n③ 第10條第1項（中央）：兒童托育補助辦法（對象、條件、額度、特殊情事）。\n④ 第13條第5項（中央）：居家托育人員登記、收托人數、輔導、管理、檢查、廢止登記辦法。\n⑤ 第15條第1項（中央）：居家托育收費及退費項目訂定與調整原則（公告）。\n⑥ 第15條第3項（地方）：居家托育分區收費及退費基準（公告）。\n⑦ 第17條第2項（中央）：居家托育定型化契約範本與應記載及不得記載事項。\n⑧ 第20條第1項（地方）：居家托育緊急傷病或事故傷害救護原則。\n⑨ 第22條第2項（中央）：定點臨時托育服務監督、檢查與輔導辦法。\n⑩ 第23條第2項（中央）：居家托育服務中心執行業務處理原則等辦法。\n⑪ 第24條第3項（中央）：居家托育服務中心監督、檢查、輔導辦法。\n⑫ 第25條第2項（中央）：運用居家托育人員安置兒童之評估基準、教育訓練、訪視頻率辦法。\n⑬ 第27條第4項（中央）：托嬰中心及公共托育家園設立許可辦法。\n⑭ 第28條第6項（中央會商原民會、勞動部、教育部）：互助式托育機構設立許可與共用場址辦法。\n⑮ 第34條第5項（中央）：托育機構評鑑辦法。\n⑯ 第35條第1項（中央）：托育機構收費、退費項目及用途（公告）。\n⑰ 第36條第2項（中央）：托育機構定型化契約範本與應記載及不得記載事項。\n⑱ 第37條第3項（中央）：托育機構收托兒童團體保險辦法。\n⑲ 第38條第4項（中央）：監視錄影設備設置、影音資料管理、查閱及資安管理辦法。\n⑳ 第45條第2項（中央）：居托中心工作人員及托育機構其他人員資格辦法。\n㉑ 第46條第1項第5款（中央）：主管人員資格之其他公告事項。\n㉒ 第57條第5項（中央）：違法事件調查程序、專責人員資格與審議小組辦法。\n㉓ 第60條第6項（中央）：不適任人員通報、資訊蒐集、聘僱前後查詢辦法。\n㉔ 第63條第4項（中央）：研習辦理單位、師資、時數核給、救命術與演習辦法。\n㉕ 第86條第5項（中央）：居家托育人員違規記點辦法。\n㉖ 第87條第3項（中央）：公布行為人姓名、機構名稱及場所地址期間辦法。\n㉗ 第93條（中央）：本法施行細則。",
  subLaw:{
    desc:"以上26項辦法、準則、公告及施行細則均尚待中央（或地方）主管機關訂定發布，實務適用前請務必留意衛福部及所屬地方政府後續公告；本頁面各題目下方標註紅字「尚待訂定子法」處，即對應其中一項或多項。",
    laws:[{no:"第93條",text:"本法施行細則，由中央主管機關定之。"}]
  }
},

{
  cat:"general", pages:["general"],
  q:"中央與地方主管機關在本法下的權責如何劃分？",
  a:"中央主管機關是衛生福利部，負責全國性政策法規訂定、經費分配、評鑑規劃、資料庫建置及公告收退費原則等；地方（直轄市、縣市政府）則負責方案執行、居家托育與機構之登記管理媒合輔導監督檢查評鑑、訂定違反本法的裁罰基準，以及爭議調處等第一線業務。涉及衛政（早療）、教育（學前特教）、工務消防（建管公安）、警政（人身安全）、戶政（身分戶籍）、勞動（勞動條件）等業務，相關目的事業主管機關應配合辦理。",

{
  cat:"general", pages:["general"],
  q:"托育諮議會（中央）與托育審議會（地方）的組成有什麼規定？",
  a:"中央應召開托育諮議會，地方應召開托育審議會，負責整合規劃、協調、諮詢托育服務相關事項（包括訂定收退費項目與調整原則）。成員應包含社政、衛政、勞動主管機關代表、學者專家、居家托育服務人員或團體代表、托育機構團體代表、兒童福利團體代表、家長團體代表、婦女團體及勞工權益促進團體代表。學者專家與民間團體代表不得具民意代表身分，合計不得少於委員總數二分之一，任一性別委員不得少於三分之一；機構負責人只能以托育機構團體代表身分參與，不能用其他名義（如學者）擠入名額。",
  laws:[{no:"第8條（節錄）",text:"中央主管機關應召開托育諮議會……直轄市、縣（市）主管機關應召開托育審議會……成員應包括社政主管機關代表、衛生主管機關代表、勞動主管機關代表、相關學者專家、居家托育服務人員或團體代表、托育機構團體代表、兒童福利團體代表、家長團體代表、婦女團體代表及勞工權益促進團體代表。前項學者專家及民間團體代表，應不具民意代表身分，其合計不得少於委員總數二分之一；任一性別委員人數，不得少於委員總數三分之一。負責人不得以非托育機構團體代表之身分，擔任第三項之代表；第三項團體代表身分有異動者，主管機關應重新聘任。"}],
  note:"參考性別平等政策綱領、CEDAW及SDGs揭示之公共決策性別平等原則，訂定委員性別比例門檻；並明定利益迴避機制，避免機構負責人以學者或其他民間團體代表名義重複進入審議會，影響決策公正性。"
},
{
  cat:"general", pages:["general"],
  q:"托育服務內容應包含哪些項目？政府托育補助有什麼保障機制？",
  a:"托育服務應以兒童為主體，內容至少包括：清潔衛生安全且適宜兒童發展的環境、充分的營養保健生活照顧與學習遊戲活動、記錄兒童生活與成長並適時轉介、提供育兒諮詢及家庭支持資訊等。另外，家長受領政府托育補助時，可以在金融機構開立專戶，該專戶內的存款不能被扣押、讓與、抵銷、供擔保或強制執行，確保補助款專款專用、不被債權人追討。",
  laws:[
    {no:"第9條第1項（節錄）",text:"托育服務，應以兒童為主體……提供清潔、衛生、安全及適宜兒童發展之環境。提供兒童充分之營養、保健、生活照顧與學習、遊戲活動及社會發展相關服務。記錄兒童生活與成長及轉介。提供育兒諮詢及家庭支持相關資訊。其他有利於兒童發展之相關服務。"},
    {no:"第10條第2、3項",text:"兒童之法定代理人或實際照顧兒童之人得於金融機構開立專戶……專供存入前項補助費用。依前項規定請領補助之權利及專戶內之存款，不得作為扣押、讓與、抵銷、供擔保或強制執行之標的。"}
  ],
  note:"明定托育服務應提供的基本內容標準；並參考社會救助法及司法院釋字第596號解釋意旨，建立補助專款專用的保障機制，避免弱勢家庭的育兒扶助金遭強制執行追討，落實兒童福祉優先原則。",
  subLaw:{
    desc:"托育服務內容之實施準則，以及托育補助的對象、條件、額度與特殊情事辦法，均尚待中央主管機關訂定。",
    laws:[
      {no:"第9條第2項",text:"前項托育服務內容之實施準則，由中央主管機關定之。"},
      {no:"第10條第1項",text:"政府對接受托育服務之兒童，得視其家庭經濟條件或其他特殊情事者予以補助；其補助對象、條件、額度、特殊情事及其他相關事項之辦法，由中央主管機關定之。"}
    ]
  },
  pen:{
    desc:"違反托育服務內容實施準則者，令限期改善，屆期未改善處新臺幣6千元以上3萬元以下罰鍰，並按次處罰。",
    laws:[{no:"第84條第1項第1款",text:"有下列情形之一者，令其限期改善，屆期未改善者，處新臺幣六千元以上三萬元以下罰鍰，並按次處罰：一、違反第九條第二項所定實施準則。"}]
  }
},
{
  cat:"general", pages:["general"],
  q:"主管機關來查核或訪視時，托育人員與機構有配合義務嗎？查得到的資料會保密嗎？",
  a:"有配合義務。主管機關或受委託的機構、團體、專業人員辦理訪視、輔導、檢查、補助或調查時，托育相關人員、托育機構、家長及其他相關人員都應配合並提供資料；主管機關還可以向警政、戶政、財政等機關調閱必要資料，被請求的機關也有配合義務。反過來，執行檢查的人員必須出示證件或標誌表明身分，而且對查得的個資（包含兒童與家長資料）負保密義務，托育相關人員本身也對兒童及家長資料負有保密責任。",
  laws:[
    {no:"第65條",text:"托育相關人員對兒童及其法定代理人或實際照顧兒童之人之資料，應予保密。但經兒童之法定代理人或實際照顧兒童之人同意或依其他法律規定應予提供者，不在此限。"},
    {no:"第68條第1項",text:"直轄市、縣（市）主管機關或其委託之機構、團體或專業人員於辦理托育服務之訪視、輔導、檢查、補助或調查時，托育相關人員、托育機構、兒童法定代理人或實際照顧兒童之人及其他有關之人應予配合，並提供相關資料。直轄市、縣（市）主管機關得請求警政、戶政、財政、教育或其他相關機關（構）、團體、法人提供必要資料及相關協助；受請求者，有配合之義務。"},
    {no:"第91條",text:"直轄市、縣（市）主管機關人員執行托育服務之輔導、監督、檢查及評鑑時，應出示有關執行職務之證明文件或顯示足資辨別之標誌。"}
  ],
  note:"保障當事人隱私權，並明定受查單位的配合義務及主管機關跨機關調閱資料的權限；要求檢查人員出示身分證明，是為了確保行政檢查程序合法、降低受檢者的疑慮。"
},
{
  cat:"general", pages:["general"],
  q:"托育服務政策的實施，有哪些具體目標？",
  a:"托育服務政策的實施，應與家庭及社區密切配合，達成9項目標：滿足兒童生理需求的照顧、建構兒童合宜安全的成長環境、建立兒童與照顧者的正向依附關係、營造平等民主尊重差異的學習環境、豐富兒童遊戲探索與體驗、促進兒童群體合作發展同儕關係、啟發兒童關懷他人與環境、鼓勵兒童表達參與，以及支持育兒家庭建立夥伴關係。另外，托育服務應以兒童最佳利益為優先考量，並提供優質、普及、平價及近便性的服務；政府機關、托育機構、托育相關人員及家庭，都負有推動及促進兒童托育服務健全發展的共同責任；對於離島、偏遠、原住民族地區，或因經濟、身心、文化與族群而有協助需求的兒童，政府應優先提供適當的托育服務機會。",
  laws:[
    {no:"第4條",text:"托育服務政策之實施，應與家庭及社區密切配合，以達成下列目標：一、滿足兒童生理需求的照顧。二、建構兒童合宜、安全的成長環境。三、建立兒童與照顧者正向依附關係。四、營造兒童平等、民主、尊重差異的學習環境。五、豐富兒童遊戲探索與體驗。六、促進兒童群體合作，發展同儕關係。七、啟發兒童關懷他人與環境。八、鼓勵兒童表達參與。九、支持育兒家庭，建立夥伴關係。"},
    {no:"第5條",text:"托育服務，應以兒童之最佳利益為優先考量，及提供兒童優質、普及、平價及近便性之托育服務。政府機關、托育機構、托育相關人員及家庭，應推動及促進兒童托育服務之健全發展。政府對處於離島、偏遠及原住民族地區，或因經濟、身心、文化與族群而有協助需求之兒童（以下稱需要協助之兒童），應優先提供適當托育服務之機會。"}
  ],
  note:"托育服務之實施應與家庭及社區共同合作，以滿足兒童發展需求，爰參考幼照法規定訂定各款托育服務目標；並揭示兒童托育係政府機關、托育機構、托育相關人員及家庭的共同責任，同時特別強調對弱勢兒童的優先照顧義務，落實兒童權益保障的公平性。"

  a:"本法所定的限期改善及處罰，都由地方主管機關（直轄市、縣市政府）辦理。托育機構若因違反本法被裁處罰鍰、不得招收、停辦或廢止設立許可，除本法另有規定外，都應一併公布機構名稱及負責人姓名。至於公布姓名、機構名稱及場所地址的公布期間，則授權由中央主管機關另訂統一標準。如果被廢止設立許可的托育機構是法人，主管機關還要一併通知法院為該法人辦理解散登記，避免其繼續以已廢止許可的名義對外營運。",

{
  cat:"reg", pages:["home"],
  q:"本法施行前已修畢訓練課程的人，還能繼續執業或辦理登記嗎？",
  a:"分兩種情形：①施行前已取得居家托育服務證書者，本法施行後可以直接繼續提供服務，不受影響。②施行前已修畢托育人員專業訓練課程、領有結業證書，但還沒取得服務證書者，自本法施行之日起1年內，仍可依第13條第1項規定向主管機關辦理登記、取得服務證書後繼續提供服務。要注意的是，若日後登記遭主管機關廢止，就必須依本法施行後的新資格規定（技術士證或幼保、家政、護理相關科系畢業）重新辦理登記，不能再用「已修畢舊訓練課程」的身分回來。",
  laws:[{no:"第88條",text:"居家托育人員於本法施行前，已修畢托育人員專業訓練課程領有結業證書，並取得居家托育服務證書者，於本法施行後得依本法繼續提供居家托育服務。本法施行前已修畢托育人員專業訓練課程領有結業證書，尚未取得居家托育服務證書者，自本法施行之日起一年內，得依第十三條第一項規定向直轄市、縣（市）主管機關辦理居家托育服務登記並取得居家托育服務證書後，依本法提供居家托育服務。依第一項及第二項規定提供居家托育服務，如其登記嗣經廢止者，應適用本法施行後之規定重新辦理居家托育服務登記，始得提供居家托育服務。"}],
  note:"基於信賴保護原則，保障既有執業者與已受訓完畢者的既得權益，並設定1年的過渡落日期間，讓尚未取得證書者有充分時間完成登記；但若登記經廢止，基於新法已生效，重新登記時須符合新資格要件，不能再援用舊制。"
},

  q:"什麼是「不當對待」？包含哪些行為？",
  a:"托育相關人員或居家托育服務中心的工作人員，不得對受托兒童有身心虐待、體罰、霸凌、性騷擾、不當管教及其他身心暴力或不當對待行為。這些行為的具體內涵未來會在本法施行細則中定義：身心虐待指違反人道程度、對兒童身心健全發展造成相當侵害的體罰、霸凌等行為；體罰指基於處罰目的對兒童身體施加強制力；霸凌指持續以言語、文字、肢體、網路等方式貶抑、排擠、欺負兒童；性騷擾指與性或性別有關的不受歡迎言詞行為；不當管教指違反照顧管教相關法令的管教措施；其他身心暴力或不當對待則是超出社會通念可忍受程度、對兒童身心造成侵害的作為或不作為。",

  note:"考量行為人違反第47條第1項規定情節未達終身不得擔任程度者，仍有繼續擔任托育相關人員、居家托育服務中心工作人員，或限制擔任托育相關職務一定期間屆滿後回任的可能，為降低行為人再犯風險，明定主管機關可依身心狀況及違法情節輕重，令其接受課程或措施，協助改進其托育及照顧服務相關知能，而非逕予裁罰。",

    laws:[{no:"第77條",text:"托育相關人員無正當理由不配合執行直轄市、縣（市）主管機關依第四十八條本文規定所為之處置者，處新臺幣一萬元以上五萬元以下罰鍰，並令其限期改善，屆期未改善者，按次處罰。"}]

{
  cat:"qualify", pages:["home"],
  q:"除了本法第49、50條，還有哪些法規的消極資格情形會讓人不能擔任托育相關人員？",
  a:"有。第51條進一步串接了其他相關法規已認定的消極資格情形，包括：幼照法第23、24條所列情形、教保服務人員條例第12、13條所列情形、教師法第14、15、18條所列情形、性別平等教育法第29條所列情形，以及補習及進修教育法第9條第6項所列情形。換句話說，只要在教保、教師等其他教育照顧領域被認定不得任用的人，同樣不得擔任本法的托育相關人員或居家托育服務中心工作人員。如果這些情形已經依相關法規的通報辦法通報有案，機構或居托中心應直接終止契約，不用再走本法第57條的調查審議程序；若尚未通報有案，則仍應依第49條、第50條或本條規定辦理。",
  laws:[

{

  a:"托育機構負責人除了適用第49條所列情形（性侵害、毒品等）外，還有專屬於負責人身分的消極資格：曾犯貪污治罪條例貪污罪、故意殺人、故意重傷、搶奪、強盜、恐嚇取財、擄人勒贖、槍砲彈藥刀械管制條例第7或第8條之罪、組織犯罪防制條例第3、4或6條之罪，經有罪判決確定者，主管機關應認定其終身不得擔任托育機構負責人並公布姓名。另外，若負責人有第50條第1項第1款、第4款至第6款所列情形之一（如家庭暴力罪緩起訴、動保法犯罪經有罪判決等），則限制1至4年不得擔任負責人，同樣會被公布姓名。",
  laws:[
    {no:"第52條",text:"托育機構負責人有下列各款情形之一者，直轄市、縣（市）主管機關應認定其終身不得擔任托育機構負責人，並公布其姓名：一、有第四十九條各款情形之一。二、曾犯下列各罪之一，經有罪判決確定：(一)貪污治罪條例之貪污罪。(二)故意殺人、故意重傷、搶奪、強盜、恐嚇取財或擄人勒贖。(三)槍砲彈藥刀械管制條例第七條或第八條之罪。(四)組織犯罪防制條例第三條、第四條或第六條之罪。"},
    {no:"第53條",text:"托育機構負責人有第五十條第一項第一款、第四款至第六款情形之一者，直轄市、縣（市）主管機關應認定其一年至四年不得擔任托育機構負責人，並公布其姓名。"}
  ],
  note:"考量托育機構提供未滿二歲兒童保育照顧服務，其負責人良窳將影響托育服務品質及業務發展，參考兒少權法及幼照法規定，明定終身及限期不得擔任托育機構負責人的具體犯罪類型，以期降低危害兒童之可能、保護兒童安全；情節相對非屬重大者，考量過度限制恐有礙工作權之虞，改採1至4年的限期禁止。",
  alsoApplies:["org"]
},

  a:"直轄市、縣（市）主管機關應廢止該機構的設立許可。但如果是政府機關或公立學校委託辦理的托育機構，考量其具公益性質、屬於類公共化托育機構，主管機關改為令其限期更換負責人，而不是直接廢止設立許可。",
  laws:[

    {no:"第56條第2項",text:"政府機關（構）及公立學校委託辦理托育機構之負責人有第四十七條第一項、第五十二條、第五十三條規定情形之一者，直轄市、縣（市）主管機關應令其限期更換負責人。"}

  note:"參考幼照法規定，托育機構負責人有不得擔任負責人的情形者，主管機關應廢止其設立許可，以確保托育機構負責人的適任性；但政府機關及公立學校委託辦理之托育機構具公益性質，屬類公共化托育機構，爰改採令其限期更換負責人的較輕處置，避免影響原有受托兒童的服務延續性。",

{
  cat:"qualify", pages:["org"],
  q:"機構或居家托育服務中心聘僱新進人員前，需要做什麼查核？",
  a:"托育機構聘僱主管人員、機構托育人員、工作人員前，以及居家托育服務中心受託單位聘僱工作人員前，都要查詢該人員有無第49條、第50條或第51條第1項所列不得任用情形；已聘僱者，也要定期查詢。聘僱前還要檢具名冊、資格證明、切結書、健康檢查表、最近3個月內的警察刑事紀錄證明書等文件，報主管機關核准；日後有異動（如離職）要在14天內報備查。",
  laws:[
    {no:"第60條第3項",text:"托育機構聘僱主管人員、機構托育人員、工作人員或居家托育服務中心受託單位聘僱工作人員前，應查詢其有無第四十九條、第五十條或第五十一條第一項規定情形；已聘僱者，應定期查詢。"},
    {no:"第60條第4項",text:"托育機構於聘僱主管人員、機構托育人員、工作人員或居家托育服務中心受託單位聘僱工作人員前，應檢具相關名冊、資格證明文件影本、切結書、健康檢查表影本、最近三個月內核發之警察刑事紀錄證明書及其他由中央主管機關公告之基本資料文件，報直轄市、縣（市）主管機關核准；該等人員有聘僱以外之異動時，應於十四日內報直轄市、縣（市）主管機關備查。直轄市、縣（市）主管機關應主動查證，並得派員檢查。"}
  ],
  note:"為落實托育機構及居家托育服務中心把關進用人員資格的責任，明定聘僱前後的查詢、報核及異動報備義務，避免有前科或消極資格情事之人員混入托育現場；居家托育人員因不屬於「聘僱他人」的雇主角色，故本條不適用於居家托育人員本人。",
  pen:{
    desc:"托育機構未查詢或聘僱後未定期查詢者，處負責人新臺幣1萬元以上5萬元以下罰鍰；未於聘僱前報核准者，處負責人新臺幣3萬元以上30萬元以下罰鍰；聘僱人員異動未於14日內報備查者，處負責人新臺幣1萬元以上5萬元以下罰鍰。",
    laws:[
      {no:"第80條第1項第7款",text:"托育機構有下列情形之一者，處負責人新臺幣一萬元以上五萬元以下罰鍰……七、未依第六十條第三項規定於聘僱主管人員、機構托育人員及工作人員前辦理查詢，或於聘僱後定期查詢。"},
      {no:"第80條第1項第8款",text:"八、違反第六十條第四項規定，聘僱之主管人員、機構托育人員或工作人員有聘僱以外之異動，未於十四日內報直轄市、縣（市）主管機關備查。"},
      {no:"第73條第1項第5款",text:"托育機構有下列情形之一者，處負責人新臺幣三萬元以上三十萬元以下罰鍰……五、未依第六十條第四項規定，於聘僱主管人員、機構托育人員及工作人員前報直轄市、縣（市）主管機關核准。"}
    ]
  },

  q:"發現孩子有疑似發展遲緩的情形，要通報誰？",
  a:"居家托育人員、居家托育服務中心工作人員及托育機構發現收托兒童有疑似發展遲緩情形，都要通報直轄市、縣（市）主管機關；居家托育人員通報時，還要同時通知居家托育服務中心。這一條同時點名了居家托育人員、居家托育服務中心工作人員與托育機構三種身分。",

{
  cat:"report", pages:["home"],
  q:"主管機關接獲檢舉或知悉疑似違法事件後，調查程序的時效為何？",
  a:"主管機關接獲檢舉或知悉疑似違法事件後，應於2個工作日內開始處理；受理後應指派專責人員或組成調查小組進行調查，調查小組應於組成後30日內完成調查，必要時可以延長，但延長期間不得超過30日（等於最長60天），並應通知當事人、檢舉人及居家托育服務中心或托育機構。調查結果會交由審議小組審議，審議時如有必要，可以邀請其他相關學者專家、專科醫師、醫事人員或性別平等專家提供專業意見。",
  laws:[
    {no:"第57條第1項",text:"直轄市、縣（市）主管機關接獲檢舉或知悉托育相關人員與居家托育人員共同居住之人或居家托育服務中心工作人員疑似涉有第四十七條第一項、第四十九條至第五十一條第一項、第五十二條至第五十四條第一項或第五十五條所定違法事件後，應於二個工作日內進行處理。"},
    {no:"第57條第2項",text:"直轄市、縣（市）主管機關受理前項疑似違法事件後，應指派專責人員或組成調查小組進行調查，調查小組應於組成後三十日內完成調查；必要時，得予延長，延長期間不得逾三十日，並應通知當事人、檢舉人及居家托育服務中心或托育機構。"},
    {no:"第57條第3項",text:"直轄市、縣（市）主管機關為審議前項違法事件之調查結果，應設審議小組；審議時如有必要，得邀請其他相關學者專家、專科醫師、醫事人員或性別平等專家提供專業意見。"}
  ],
  note:"為及時處理托育相關人員及與居家托育人員共同居住之人或居家托育服務中心工作人員疑有不適任情形或相關違法事件，明定主管機關接獲檢舉或知悉後應於2個工作日內開始處理，並訂定調查小組30日（可延長30日，合計最長60日）的辦理期限，避免案件久懸不決。",
  subLaw:{
    desc:"直轄市、縣（市）主管機關的調查程序、專責人員資格，以及審議小組的組成資格、人數等相關事項辦法，尚待中央主管機關訂定。",
    laws:[{no:"第57條第5項",text:"第二項至第四項直轄市、縣（市）主管機關之調查程序、專責人員資格，與審議小組之組成資格、人數及其他相關事項之辦法，由中央主管機關定之。"}]

{
  cat:"report", pages:["home"],
  q:"托育相關人員涉案調查期間，收托的孩子怎麼安排？",
  a:"主管機關一旦知悉托育機構所屬托育相關人員、居家托育人員或與其共同居住之人，涉有違法事件時，應立即通知受托兒童的家長，並在行政調查、刑事偵查或法院審理期間，協助托育機構及居家托育人員依家長意願轉介收托的兒童，同時加強訪視輔導；必要時，還可以命令暫停新收托兒童或暫停托育服務。",
  laws:[{no:"第61條第1項",text:"直轄市、縣（市）主管機關知悉托育機構所屬托育相關人員、居家托育人員及與其共同居住之人，涉有第五十七條第一項所定違法事件時，應即通知受托兒童之法定代理人或實際照顧兒童之人，並於行政調查、刑事偵查或法院審理期間，協助托育機構及居家托育人員，依法定代理人或實際照顧兒童之人意願轉介收托之兒童，並加強訪視輔導；必要時，得令其暫停新收托兒童或暫停托育服務。"}],
  note:"考量托育機構的托育相關人員、居家托育人員及與其共同居住之人對受托兒童有不當行為時，倘仍持續收托兒童，對兒童身心安全危害甚鉅；惟行政及司法調查需時，為及時防堵危害兒童安全事件再發生，並兼顧托育相關人員之工作權，明定主管機關應即通知家長、協助依家長意願轉介收托兒童，並加強訪視輔導，必要時得令暫停新收托或暫停服務。",
  alsoApplies:["home","org","center"]
},

{

  q:"托育專業人員每年要上多少小時的研習？",

  laws:[{no:"第63條第1項",text:"托育專業人員每年應完成十八小時以上托育專業知能研習；每二年所接受研習，應包括性別平等課程。"}],

  a:"新進托育專業人員要在提供服務前2年內、或到職後3個月內完成8小時以上兒童基本救命術訓練；之後每2年還要再完成8小時以上救命術訓練、3小時以上事故傷害預防及處理課程，以及至少1次緊急救護情境演習。居家托育人員與機構托育人員均適用。",

{
  cat:"penalty", pages:["home"],
  q:"居家托育人員屢次違規、限期改善都沒改善，最終會被廢止登記嗎？",
  a:"會。本法對多數居家托育人員的違規事項，都採取「限期改善 → 屆期未改善按次處罰 → 情節重大或連續處罰三次仍未改善」的三階段機制；一旦進入第三階段，主管機關就可以廢止該居家托育人員的登記，並公布其姓名。這個機制適用於超收人數、超收費用、未訂契約、未投保、未專心托育、未通報等多項違規類型（分別規定在第71條、第78條、第81條）。廢止登記後，依第78條第2項規定，1年內不得重新辦理登記為居家托育人員。",
  laws:[
    {no:"第78條第1項（節錄）",text:"居家托育人員有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰，並令其限期改善，屆期未改善者，按次處罰；其情節重大或經處罰三次仍未改善者，得公布其姓名及廢止其登記：……"},
    {no:"第78條第2項",text:"依前項規定廢止登記者，自廢止之日起一年內不得辦理登記為居家托育人員。"}
  ],
  note:"透過「限期改善—按次處罰—情節重大或累犯廢止登記」的漸進式裁罰設計，讓輕微或初次違規者有改善機會，同時對屢勸不聽或情節重大者訂有明確退場機制，兼顧比例原則與兒童安全保護。"
},
{
  cat:"penalty", pages:["org"],
  q:"托育機構違規經限期改善、多次處罰仍未改善，最嚴重會怎樣？",
  a:"本法對多數托育機構的違規事項，同樣採取「限期改善 → 屆期未改善按次處罰 → 情節重大或連續處罰三次仍未改善」的三階段機制；進入第三階段後，主管機關可以依情節輕重，令機構停止招收6個月至1年、停辦1年至3年，甚至直接廢止設立許可——這是本法罰則中對機構最嚴重的行政處分。這個機制適用於超收兒童、收費違規、聘用有消極資格情事人員、規避檢查藏匿兒童等多項情節重大的違規類型（規定在第72條、第73條、第80條）。",
  laws:[{no:"第72條第1項（節錄）",text:"托育機構有下列情形之一者，處負責人新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善，屆期未改善者，按次處罰；其情節重大或經處罰三次仍未改善者，得依情節輕重令停止招收六個月至一年、停辦一年至三年或廢止其設立許可：……"}],
  note:"對機構違規採漸進式裁罰設計，讓輕微或初次違規有改善空間，同時對情節重大或屢犯者訂有「停招→停辦→廢照」的階梯式退場機制，主管機關可依違規嚴重程度彈性選擇處分強度，兼顧兒童安全保護與機構經營權益的比例原則。"
},

// build page nav
const pageNav = document.getElementById("pageNav");
pages.forEach(p=>{
  const btn = document.createElement("div");
  btn.className = "pageBtn" + (p.id==="general" ? " active" : "");
  btn.textContent = p.short;
  btn.dataset.page = p.id;
  btn.onclick = ()=>{
    document.querySelectorAll(".pageBtn").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    currentPage = p.id;
    currentCat = "all";
    if(searchAllPages){
      searchAllPages = false;
      document.getElementById("searchAllToggle").checked = false;
    }
    buildCatTabs();
    updatePageHead();
    render();
    document.getElementById("pageNavAnchor").scrollIntoView({behavior:"smooth", block:"start"});
  };
  pageNav.appendChild(btn);
});

let currentPage = "general";
let currentCat = "all";
let searchAllPages = false;

function effectivePage(){
  return searchAllPages ? "ALL" : currentPage;
}

function updatePageHead(){
  if(searchAllPages){
    document.getElementById("pageTitle").textContent = "全部頁面搜尋中";
    document.getElementById("pageDescText").textContent = "已跨總則／居家托育人員／托育機構／居家托育服務中心四個頁面搜尋，取消勾選「搜尋全部頁面」可回到單頁瀏覽。";
    return;
  }
  const p = pages.find(x=>x.id===currentPage);
  document.getElementById("pageTitle").textContent = p.name;
  document.getElementById("pageDescText").textContent = p.desc;
}

function catsOnPage(page){
  const idsInUse = new Set(
    (page==="ALL" ? qa : qa.filter(item=>item.pages.includes(page)))
      .map(item=>item.cat)
  );
  return categories.filter(c=>idsInUse.has(c.id));
}

function buildCatTabs(){
  const tabWrap = document.getElementById("catTabs");
  tabWrap.innerHTML = "";
  const allBtn = document.createElement("div");
  allBtn.className = "tab all active";
  allBtn.textContent = "全部";
  allBtn.dataset.cat = "all";
  allBtn.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    allBtn.classList.add("active");
    currentCat = "all";
    render();
  };
  tabWrap.appendChild(allBtn);

  catsOnPage(effectivePage()).forEach(c=>{
    const btn = document.createElement("div");
    btn.className = "tab";
    btn.textContent = c.name;
    btn.dataset.cat = c.id;
    btn.onclick = ()=>{
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      btn.classList.add("active");
      currentCat = c.id;
      render();
    };
    tabWrap.appendChild(btn);
  });
}

function expandKeyword(kw){
  if(!kw) return [];
  const terms = new Set([kw]);
  synonymGroups.forEach(group=>{
    if(group.some(t=>t.toLowerCase()===kw.toLowerCase())){
      group.forEach(t=>terms.add(t));
    }
  });
  return Array.from(terms);
}

function highlight(text, terms){
  if(!terms || terms.length===0) return text;
  const escaped = terms
    .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))
    .sort((a,b)=>b.length-a.length);
  const re = new RegExp('(' + escaped.join('|') + ')', 'gi');
  return text.replace(re, m=>`<mark style="background:#FFE9A8;border-radius:3px;">${m}</mark>`);
}

function render(){
  const kw = document.getElementById("searchInput").value.trim();
  const terms = expandKeyword(kw);
  const area = document.getElementById("cardArea");
  area.innerHTML = "";

  let list = qa.filter(item=>{
    const inPage = searchAllPages ? true : item.pages.includes(currentPage);
    if(!inPage) return false;
    const catOk = currentCat==="all" || item.cat===currentCat;
    if(!catOk) return false;
    if(!kw) return true;
    const penHay = item.pen ? (item.pen.desc + item.pen.laws.map(l=>l.no+l.text).join("")) : "";
    const subHay = item.subLaw ? (item.subLaw.desc + item.subLaw.laws.map(l=>l.no+l.text).join("")) : "";
    const noteHay = item.note || "";
    const hay = item.q + item.a + item.laws.map(l=>l.no+l.text).join("") + catName[item.cat] + penHay + subHay + noteHay;
    return terms.some(t => hay.toLowerCase().includes(t.toLowerCase()));
  });

  document.getElementById("countLine").textContent = `共 ${list.length} 筆結果`;
  document.getElementById("emptyMsg").style.display = list.length ? "none" : "block";

  list.forEach((item)=>{
    const card = document.createElement("div");
    card.className = "card";

    const lawHtml = item.laws.map(l=>`
      <div class="lawBlock">
        <div class="lawNo">📖 ${l.no}</div>
        <div class="lawText">${highlight(l.text, terms)}</div>
      </div>
    `).join("");

    let noteHtml = "";
    if(item.note){
      noteHtml = `
        <div class="sectionWrap">
          <div class="sectionHead noteHead">📌 立法說明</div>
          <div class="noteText">${highlight(item.note, terms)}</div>
        </div>
      `;
    }

    let penaltyHtml = "";
    if(item.pen){
      const penLawHtml = item.pen.laws.map(l=>`
        <div class="penaltyBlock">
          <div class="penaltyNo">⚖️ ${l.no}</div>
          <div class="penaltyText">${highlight(l.text, terms)}</div>
        </div>
      `).join("");
      penaltyHtml = `
        <div class="sectionWrap">
          <div class="sectionHead penaltyHead">⚖️ 罰則</div>
          <div class="penaltyDesc">${highlight(item.pen.desc, terms)}</div>
          ${penLawHtml}
        </div>
      `;
    }

    let subLawHtml = "";
    if(item.subLaw){
      const subLawLawHtml = item.subLaw.laws.map(l=>`
        <div class="subLawBlock">
          <div class="subLawNo">🚧 ${l.no}</div>
          <div class="subLawText">${highlight(l.text, terms)}</div>
        </div>
      `).join("");
      subLawHtml = `
        <div class="sectionWrap">
          <div class="sectionHead subLawHead">🚧 尚待訂定子法</div>
          <div class="subLawDesc">${highlight(item.subLaw.desc, terms)}</div>
          ${subLawLawHtml}
        </div>
      `;
    }

    const also = item.alsoApplies && item.alsoApplies.length>1 ? item.alsoApplies : null;

    const pageBadgeHtml = searchAllPages
      ? `<span class="miniFlag multi" style="background:var(--navy-2);color:#fff;">📍 ${pageLabel[item.pages[0]]}</span>`
      : '';

    const applyHtml = `
      <div class="applyWrap">
        ${also ? `<span class="applyText">👥 同時適用：${also.map(p=>pageLabel[p]).join("、")}</span>` : `<span></span>`}
        <span class="backToMenu">🔝 回到主選單</span>
      </div>
    `;

    const flagsHtml = `
      <div class="badges">
        ${pageBadgeHtml}
        ${item.pen ? '<span class="miniFlag pen">⚖ 有罰則</span>' : ''}
        ${item.subLaw ? '<span class="miniFlag sub">🚧 待訂子法</span>' : ''}
        ${also ? '<span class="miniFlag multi">👥 跨身分適用</span>' : ''}
      </div>
    `;

    card.innerHTML = `
      <div class="qRow">
        <div class="qmark">Q</div>
        <div style="flex:1;">
          <div class="qtext">${highlight(item.q, terms)}</div>
          ${flagsHtml}
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="answer">
        <div class="answerInner">
          <span class="catBadge">${catName[item.cat]}</span>
          <div class="answerText"><strong>A｜</strong>${highlight(item.a, terms)}</div>
          ${lawHtml}
          ${noteHtml}
          ${subLawHtml}
          ${penaltyHtml}
          ${applyHtml}
        </div>
      </div>
    `;
    card.querySelector(".qRow").addEventListener("click", ()=>{
      card.classList.toggle("open");
    });
    card.querySelector(".backToMenu").addEventListener("click", (e)=>{
      e.stopPropagation();
      document.getElementById("pageNavAnchor").scrollIntoView({behavior:"smooth", block:"start"});
    });
    area.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("searchAllToggle").addEventListener("change", (e)=>{
  searchAllPages = e.target.checked;
  currentCat = "all";
  buildCatTabs();
  updatePageHead();
  render();
});
buildCatTabs();
updatePageHead();
render();
</script>
</body>
</html>
